name: epad
description: "ePad for Android - a simple quick-notes pad. Plain ASCII text, no formatting, stored in SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
